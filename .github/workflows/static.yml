# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install video thumbnail tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate real video thumbnail frames
        run: |
          set -e
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i assets/videos/carlos-2039.mp4 -frames:v 1 -q:v 3 assets/images/carlos-2039.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i assets/videos/carlos-1952.mp4 -frames:v 1 -q:v 3 assets/images/carlos-1952.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i assets/videos/carlos-1950.mp4 -frames:v 1 -q:v 3 assets/images/carlos-1950.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i assets/videos/amore-3155.mp4 -frames:v 1 -q:v 3 assets/images/amore-3155.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i assets/videos/amore-3108.mp4 -frames:v 1 -q:v 3 assets/images/amore-3108.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
